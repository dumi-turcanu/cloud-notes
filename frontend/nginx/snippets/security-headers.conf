# Included in every location that serves HTML or assets: add_header in a
# location replaces (does not extend) headers defined at server level.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Browsers ignore HSTS over plain HTTP, so it is safe to send unconditionally.
add_header Strict-Transport-Security "max-age=31536000" always;
